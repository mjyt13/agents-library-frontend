server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # vue-router в history-режиме: неизвестные пути отдаём как index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # .oga нет в дефолтном mime.types nginx — проставляем тип явно
    location ~* \.oga$ {
        default_type audio/ogg;
    }

    # хэшированные ассеты Vite (имя меняется при изменении) — кэшируем надолго
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html не кэшируем, чтобы новый деплой подхватывался сразу
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
